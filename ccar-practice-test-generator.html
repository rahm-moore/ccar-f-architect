<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  :root { color-scheme: light; --accent: #7a5cff; --accent-hover: #6a4ce8; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f7f7f5;
    color: #1a1a1a;
    margin: 0;
    padding: 24px;
  }
  .container { max-width: 780px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: #666; font-size: 14px; margin-bottom: 16px; }
  .caveat { background: #fff8e6; border: 1px solid #f0dca0; border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #6b5900; margin-bottom: 16px; }
  .exam-switch { display: flex; gap: 0; margin-bottom: 18px; border: 1px solid #ddd; border-radius: 10px; overflow: hidden; width: fit-content; }
  .exam-switch button {
    background: #fff; color: #444; border: none; padding: 10px 22px; font-size: 14px; font-weight: 600;
    cursor: pointer; border-radius: 0;
  }
  .exam-switch button.active { background: var(--accent); color: #fff; }
  .exam-switch button:hover:not(.active) { background: #f2f2f2; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .toolbar button.secondary { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  .toolbar button.secondary:hover { background: #f7f5ff; }
  .domain-header {
    margin-top: 32px; margin-bottom: 8px; font-size: 13px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent);
    border-bottom: 2px solid #eee; padding-bottom: 6px;
  }
  .question-card { background: #fff; border: 1px solid #e5e5e2; border-radius: 10px; padding: 18px 20px; margin-bottom: 14px; }
  .question-text { font-weight: 600; margin-bottom: 12px; line-height: 1.4; }
  .option { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; transition: background 0.15s; }
  .option:hover { background: #f7f5ff; }
  .option input { margin-top: 3px; }
  .option label { cursor: pointer; line-height: 1.4; }
  .option.correct { background: #e6f7ec; }
  .option.incorrect { background: #fdecec; }
  .explanation { display: none; margin-top: 10px; padding: 10px 12px; background: #f8f7ff; border-left: 3px solid var(--accent); border-radius: 6px; font-size: 14px; color: #333; }
  .explanation.show { display: block; }
  .submit-bar { position: sticky; bottom: 0; background: #f7f7f5; padding: 16px 0; text-align: center; border-top: 1px solid #e5e5e2; margin-top: 24px; }
  button { background: var(--accent); color: white; border: none; padding: 12px 28px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:hover { background: var(--accent-hover); }
  button:disabled { background: #ccc; cursor: not-allowed; }
  #results { display: none; background: #fff; border: 1px solid #e5e5e2; border-radius: 10px; padding: 20px; margin-top: 20px; text-align: center; }
  #results.show { display: block; }
  #score { font-size: 32px; font-weight: 700; color: var(--accent); }
  #verdict { margin-top: 6px; color: #444; }
  .domain-breakdown { margin-top: 16px; text-align: left; font-size: 14px; }
  .domain-breakdown div { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #f0f0f0; }
  .reset-link { display: block; margin-top: 14px; font-size: 13px; color: var(--accent); cursor: pointer; text-decoration: underline; }
  #history { margin-top: 32px; }
  #history h2 { font-size: 16px; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; }
  th { background: #f7f5ff; color: #444; font-weight: 600; }
  .clear-history { font-size: 12px; color: #999; cursor: pointer; text-decoration: underline; margin-top: 8px; display: inline-block; }
  .empty-history { color: #888; font-size: 13px; font-style: italic; }
</style>
</head>
<body>
<div class="container">
  <h1 id="pageTitle">CCAR Practice Test Generator</h1>
  <div class="exam-switch" id="examSwitch">
    <button id="btnCcarF" data-exam="CCAR-F">CCAR-F (Foundations)</button>
    <button id="btnCcarP" data-exam="CCAR-P">CCAR-P (Professional)</button>
  </div>
  <div class="subtitle" id="pageSubtitle"></div>
  <div class="caveat" id="pageCaveat"></div>
  <div class="toolbar">
    <button id="generateBtn">Generate New Test</button>
    <button class="secondary" id="clearHistoryBtn">Clear History</button>
  </div>
  <form id="quizForm"></form>
  <div class="submit-bar" id="submitBar" style="display:none;">
    <button id="submitBtn" type="button">Submit Test</button>
  </div>
  <div id="results">
    <div id="score"></div>
    <div id="verdict"></div>
    <div class="domain-breakdown" id="domainBreakdown"></div>
    <span class="reset-link" id="retakeLink">Generate another test</span>
  </div>

  <div id="history">
    <h2>Past Attempts (saved in this browser)</h2>
    <div id="historyContent"></div>
  </div>
</div>

<script>
const examData = {"CCAR-F":{"label":"CCAR-F (Foundations)","accent":"#7a5cff","accentHover":"#6a4ce8","questionBank":[{"domain":"Agentic Architecture & Orchestration","q":"You're designing a Claude Code workflow where a main agent needs to research a topic across 15 files, summarize findings, and only then make an edit. The research step would otherwise consume most of the context window. What's the best architectural choice?","options":["Have the main agent read all 15 files directly into its own working context","Delegate the research to a subagent that returns only a condensed summary to the main agent's context","Split the task into 15 separate top-level conversations, one per file","Use a model with a larger context window for the main agent only"],"correct":1,"exp":"Delegating research to a subagent keeps the bulk of file-reading out of the main agent's context; only the summary returns. This is the core value of subagent architecture for context management."},{"domain":"Agentic Architecture & Orchestration","q":"A hub-and-spoke multi-agent design assigns one orchestrator agent to delegate to several specialized subagents. What is the primary reliability risk this pattern introduces?","options":["Subagents are architecturally prevented from calling any tools","Subagents automatically share their full context with every other subagent","Hub-and-spoke designs are incompatible with Claude Code environments","The orchestrator becomes a bottleneck or single point of failure if it accumulates too much state"],"correct":3,"exp":"Centralizing coordination in one orchestrator creates a bottleneck: if it accumulates too much state or fails, the whole system is affected."},{"domain":"Agentic Architecture & Orchestration","q":"When should you prefer an agentic loop (plan, act, observe, repeat) over a single-shot prompt?","options":["When the next step depends on results that can't be known until a tool call returns","When the task is fully specified upfront and needs no intermediate verification","Only when calling the Claude API directly, never inside Claude Code","Agentic loops should generally be avoided due to their cost"],"correct":0,"exp":"Agentic loops earn their cost when the next step depends on unpredictable results from a prior action (tool output, search result, etc.)."},{"domain":"Agentic Architecture & Orchestration","q":"A subagent you designed keeps re-reading the same file on every turn, wasting tokens. What's the most likely design fix?","options":["Raise the subagent's max_tokens limit substantially","Switch the subagent to a smaller, cheaper model","Have the subagent cache or summarize the file into its own working memory instead of re-fetching it","Remove the subagent and fold its work into the main agent"],"correct":2,"exp":"Re-fetching the same data repeatedly is a context/token waste; the fix is caching or summarizing into working memory rather than re-reading."},{"domain":"Agentic Architecture & Orchestration","q":"Which of the following best describes \"task decomposition\" in agentic architecture?","options":["Reducing the size of a model's context window","Compressing prior conversation history into a summary","Splitting a single API request across multiple network packets","Breaking a complex goal into smaller, independently executable subtasks assigned to agents or tools"],"correct":3,"exp":"Task decomposition is about breaking work into smaller, assignable units — not about context size or network-level concerns."},{"domain":"Claude Code Configuration & Workflows","q":"What is the primary purpose of a CLAUDE.md file in a project repository?","options":["To provide persistent project-level context and conventions that Claude Code reads each session","To store API keys and secrets needed by the project","To serve as a full replacement for the project's README file","To hold CI/CD pipeline configuration exclusively, unrelated to Claude"],"correct":0,"exp":"CLAUDE.md is a persistent context file Claude Code reads for project conventions, not a secrets store or CI-only config."},{"domain":"Claude Code Configuration & Workflows","q":"A team wants a repeatable, one-word way to trigger a specific multi-step review process in Claude Code across all their repos. What should they build?","options":["A separate, unrelated CLAUDE.md file per repo with no shared logic","A subagent that is never given a defined trigger condition","A custom slash command defined for that review process","A GitHub Action that does not involve Claude Code at all"],"correct":2,"exp":"Custom slash commands are built exactly for repeatable, named, multi-step triggers."},{"domain":"Claude Code Configuration & Workflows","q":"In a CI/CD pipeline, what's a key reliability consideration when invoking Claude Code non-interactively (headless mode)?","options":["Headless invocations require no error handling since they cannot fail","The invocation should have bounded scope and a clear success/failure signal, with no interactive confirmation required","Headless mode retries every failed step indefinitely by default","CI/CD pipelines are structurally unable to invoke Claude Code"],"correct":1,"exp":"Headless/non-interactive invocations need bounded scope and clear success/failure signals since there's no human in the loop to intervene."},{"domain":"Claude Code Configuration & Workflows","q":"Your organization wants engineers to inherit consistent coding conventions across every project without copy-pasting the same instructions repeatedly. What's the best mechanism?","options":["A hierarchy of CLAUDE.md files, such as an org-level file plus per-project overrides","Emailing the conventions document to each engineer individually","Re-typing the conventions into every prompt manually each session","Accepting that context cannot be shared consistently across projects"],"correct":0,"exp":"A CLAUDE.md hierarchy (org-level + project-level) is the mechanism for consistent, inherited context without duplication."},{"domain":"Prompt Engineering & Structured Output","q":"You need Claude's response to reliably parse as valid JSON matching a specific schema for downstream automation. What's the most robust approach?","options":["Politely ask for JSON in the prompt and hope the model complies","Always switch to the largest available model instead","Parse the response as freeform text and regex out the relevant fields","Use tool use or structured output enforcement with a defined schema, rather than relying on prompt instructions alone"],"correct":3,"exp":"Tool use / schema-based structured output enforces structure far more reliably than instructions alone."},{"domain":"Prompt Engineering & Structured Output","q":"A structured-output call occasionally returns a response that fails schema validation. What's the best resilient pattern?","options":["Immediately surface the raw validation error straight to the end user","Run a validation-and-retry loop that feeds the specific validation error back to Claude for correction","Silently discard invalid responses without logging them","Abandon structured output and switch to a freeform prompt permanently"],"correct":1,"exp":"A validation-and-retry loop that feeds the specific validation error back to the model is the standard resilient pattern."},{"domain":"Prompt Engineering & Structured Output","q":"Few-shot prompting is most useful for which of the following?","options":["Demonstrating a desired output format or reasoning pattern so the model generalizes correctly","Reducing how much of the context window a prompt consumes","Eliminating the need for a system prompt entirely","Guaranteeing that hallucination never occurs"],"correct":0,"exp":"Few-shot examples demonstrate the desired pattern so the model generalizes the format/reasoning style."},{"domain":"Prompt Engineering & Structured Output","q":"What's the key difference between \"programmatic enforcement\" and \"prompt-based guidance\" for structured output?","options":["There is no meaningful difference between the two approaches","Prompt-based guidance is always the more reliable of the two","Programmatic enforcement guarantees structural compliance; prompt-based guidance only increases its likelihood","Programmatic enforcement can never be combined with prompt instructions"],"correct":2,"exp":"Programmatic enforcement guarantees structural compliance (it's checked/validated); prompt-based guidance only nudges probability."},{"domain":"Tool Design & MCP Integration","q":"When designing a tool description for Claude to call correctly and consistently, what matters most?","options":["Keeping the description as short as possible no matter what","A clear, unambiguous description of the tool's function, parameters, and when to use it","Omitting parameter descriptions entirely to save tokens","Tool descriptions have essentially no effect on call accuracy"],"correct":1,"exp":"Clarity on function, parameters, and usage conditions directly drives correct and consistent tool-call behavior."},{"domain":"Tool Design & MCP Integration","q":"What is the core purpose of the Model Context Protocol (MCP)?","options":["To provide a standardized way for AI applications to connect to external tools, data, and systems","To fully replace the Claude API as the primary interface","To automatically compress conversation context on a schedule","To manage billing across multiple Anthropic accounts"],"correct":0,"exp":"MCP standardizes how AI applications connect to external tools/data/systems — it's an integration protocol, not a billing or compression mechanism."},{"domain":"Tool Design & MCP Integration","q":"Your MCP server needs to support both a locally-run client (stdio) and a remotely hosted client (HTTP streaming). What's the key architectural consideration?","options":["The server must permanently commit to one transport and can never support the other","Local and remote clients require two entirely separate servers with different tools","HTTP streaming is not actually a supported MCP transport option","The transport layer should handle both stdio and HTTP streaming without changing the underlying tool logic"],"correct":3,"exp":"Good MCP server design separates transport (stdio vs. HTTP streaming) from tool logic, so the same tools work regardless of how the client connects."},{"domain":"Tool Design & MCP Integration","q":"A tool call fails intermittently because a parameter is ambiguous about units, such as \"duration\" without specifying seconds or minutes. What's the best fix?","options":["Leave it as-is, since Claude will usually infer the right unit anyway","Remove the ambiguous parameter from the schema entirely","Update the tool schema or description to explicitly state the expected unit","Switch to using a different, unrelated model for this tool call"],"correct":2,"exp":"Ambiguity in tool parameter descriptions (like missing units) is a tool-design defect; fix it at the schema/description level."},{"domain":"Context Management & Reliability","q":"A long-running agentic session is approaching its context window limit. What's a reliable strategy to continue the task without losing critical information?","options":["Summarize or compact older turns while explicitly preserving key decisions, then continue from there","Allow the session to simply fail once the limit is reached","Always restart the session from scratch with no summary carried over","Set max_tokens to an unbounded value to avoid the issue"],"correct":0,"exp":"Compaction/summarization that preserves key state is the standard approach to continuing past context limits."},{"domain":"Context Management & Reliability","q":"What is the purpose of cache_control breakpoints in the Claude API?","options":["To permanently delete older messages from a conversation","To enforce a hard rate limit on API calls","To enforce structured output formatting on responses","To mark points in a prompt where content can be cached, cutting cost and latency on repeated requests"],"correct":3,"exp":"cache_control breakpoints mark cacheable prompt segments to cut cost and latency on repeated content."},{"domain":"Context Management & Reliability","q":"In multi-turn conversation design, why is token budget management important?","options":["It generally isn't, since context windows are effectively unlimited","Without it, long conversations can silently truncate important early context or hit unexpected cost/latency limits","Token budget only ever matters when the input includes images","It affects billing only and has no effect on model behavior"],"correct":1,"exp":"Poor token budget management risks silent truncation of important context or unexpected cost/latency issues, especially in long multi-turn sessions."},{"domain":"Agentic Architecture & Orchestration","q":"An orchestrator agent delegates three subtasks to subagents in parallel, then merges their outputs into a final report. One subagent returns a result that contradicts another. What's the most architecturally sound way to handle this?","options":["Automatically discard both conflicting results and skip that section of the report","Let whichever subagent finished first take precedence, since speed implies confidence","Have the orchestrator surface the conflict and reconcile it using its own judgment or a targeted follow-up call","Re-run all three subagents from scratch until their outputs happen to agree"],"correct":2,"exp":"The orchestrator is the right layer to reconcile conflicting subagent outputs — it has visibility across all branches, whereas any single subagent doesn't. Discarding data loses information, and speed or brute-force re-running aren't reliable conflict-resolution strategies."},{"domain":"Agentic Architecture & Orchestration","q":"You're evaluating whether a workflow needs a multi-agent design or a single agent with tools. The task is: fetch a webpage, extract pricing data, and format it as a table. What's the better call?","options":["A single agent with a fetch tool and a formatting step, since the steps are sequential and don't need independent context","A three-agent pipeline, one per step, so each can specialize narrowly","A hub-and-spoke design with a dedicated orchestrator managing the fetch and format subagents","An agentic loop that repeatedly re-fetches the page until the format is perfect"],"correct":0,"exp":"Multi-agent overhead pays off when subtasks need isolated context or specialized instructions that would clutter a shared context. A simple sequential fetch-extract-format task doesn't need that separation — a single agent with tools is simpler and just as effective."},{"domain":"Agentic Architecture & Orchestration","q":"A subagent is given a narrow, well-defined tool set and a specific goal, then returns control to the orchestrator when done. What principle does this reflect?","options":["Token minimization — subagents always use fewer tokens than the main agent by design","Model downgrading — subagents must use a smaller model than the orchestrator","Statelessness — subagents cannot retain any information once invoked","Context isolation — keeping the subagent's working context scoped to only what its subtask requires"],"correct":3,"exp":"Scoping a subagent to a narrow tool set and goal is about context isolation, not an inherent guarantee about token usage, model size, or statelessness — none of which are required properties of subagents."},{"domain":"Agentic Architecture & Orchestration","q":"During a long agentic loop, the agent keeps calling the same search tool with slightly reworded queries without making progress toward the goal. What does this behavior most likely indicate?","options":["The search tool itself is broken and should be removed from the agent's toolset entirely","The loop lacks a clear termination or progress-check condition, so it should be redesigned to detect and break out of unproductive cycles","This is expected behavior and will resolve itself given enough iterations","The agent's temperature setting is too low and needs to be increased"],"correct":1,"exp":"Repeated unproductive tool calls signal a missing progress/termination check in the loop design — the fix is architectural (detect lack of progress, break or escalate), not a tool removal or a temperature tweak."},{"domain":"Agentic Architecture & Orchestration","q":"Which scenario best justifies using a hub-and-spoke orchestration pattern over a simple linear chain of steps?","options":["The task naturally decomposes into independent subtasks that can be dispatched and evaluated by a central coordinator","The task must be completed in exactly one prompt with no tool calls at all","The task only ever requires a single deterministic sequence of steps with no branching","The team wants to reduce the total number of agents involved in the workflow"],"correct":0,"exp":"Hub-and-spoke earns its complexity when subtasks are independent enough to dispatch and evaluate centrally. A strictly linear, single-path task doesn't need a coordinator, and the pattern doesn't inherently reduce agent count."},{"domain":"Claude Code Configuration & Workflows","q":"Two teams share a monorepo but want different coding conventions enforced in their respective subdirectories. How should this be handled with CLAUDE.md?","options":["Maintain a single CLAUDE.md at the root and manually remind Claude of exceptions in every session","Use separate GitHub repositories instead, since CLAUDE.md cannot vary within one repo","Store team-specific conventions in a Slack channel instead of CLAUDE.md","Place a CLAUDE.md at the repo root for shared conventions, plus a CLAUDE.md in each subdirectory for team-specific overrides"],"correct":3,"exp":"CLAUDE.md supports a hierarchy — root-level for shared conventions and subdirectory-level for overrides — which is exactly designed for this multi-team-in-one-repo scenario."},{"domain":"Claude Code Configuration & Workflows","q":"A custom slash command is meant to run a multi-step release checklist. During testing, it works fine interactively but fails unpredictably when triggered from a script. What's the most likely cause?","options":["Slash commands are not supported outside of interactive sessions under any circumstances","The command relies on interactive confirmation steps that don't resolve properly in a non-interactive context","The release checklist has too many steps for a slash command to handle","Scripts cannot invoke Claude Code at all, regardless of configuration"],"correct":1,"exp":"A common failure mode when moving from interactive to scripted/headless use is leftover reliance on interactive confirmations. Slash commands themselves can run non-interactively; the issue is usually design, not a hard limitation."},{"domain":"Claude Code Configuration & Workflows","q":"What's the main tradeoff to weigh when deciding how much detail to put into a project's CLAUDE.md file?","options":["More detail generally improves consistency but risks bloating context and burying the most important conventions","There is no tradeoff — CLAUDE.md files should always contain as much detail as possible","CLAUDE.md files are capped at a fixed number of lines, so detail is irrelevant until that limit is hit","Detail only matters for CI/CD use cases, not for interactive sessions"],"correct":0,"exp":"CLAUDE.md content competes for context budget like anything else — more detail helps consistency but can bury priorities or waste tokens if not curated, which is the real tradeoff to manage."},{"domain":"Claude Code Configuration & Workflows","q":"A headless Claude Code invocation in a CI pipeline needs to fail the build if the agent cannot complete its task, rather than silently continuing. What should the pipeline configuration ensure?","options":["The pipeline should ignore the invocation's outcome and always proceed to the next step","The agent should be given unlimited retries so it always eventually succeeds","The invocation returns a clear, checkable exit/status signal that the pipeline step interprets to determine pass or fail","Headless mode should be avoided entirely in favor of manual review for every build"],"correct":2,"exp":"Reliable CI integration depends on a clear success/failure signal the pipeline can act on — ignoring outcomes or relying on infinite retries undermines the point of automated gating."},{"domain":"Prompt Engineering & Structured Output","q":"A prompt asks Claude to output a JSON object, but roughly 1 in 20 responses includes a stray sentence before the JSON, breaking naive parsing. What's the most reliable fix?","options":["Add the word 'please' to the prompt to increase compliance","Define the expected output via a tool schema so the response is constrained to structured data rather than free text","Increase the temperature so responses vary less","Manually strip the first line of every response before parsing"],"correct":1,"exp":"Tool-based structured output constrains the response format directly, which is far more reliable than prompt phrasing tweaks, temperature changes, or post-hoc string stripping that assumes a specific failure pattern."},{"domain":"Prompt Engineering & Structured Output","q":"You're deciding between zero-shot and few-shot prompting for a classification task with a somewhat unusual label taxonomy. Which factor most strongly favors few-shot?","options":["The label taxonomy is non-standard enough that examples are needed to convey the intended categories clearly","Few-shot prompting is always strictly better regardless of task complexity","Zero-shot prompting cannot be used for classification tasks at all","Few-shot prompting eliminates the need for a system prompt"],"correct":0,"exp":"Few-shot earns its context cost when the task's expected pattern (like a non-standard taxonomy) isn't obvious from instructions alone — examples fill that gap. It's not universally superior, nor does it replace system prompts."},{"domain":"Prompt Engineering & Structured Output","q":"A validation-and-retry loop for structured output keeps failing on the same field after three attempts. What does this most likely indicate?","options":["The retry loop is working as intended and should simply run more attempts","The model is incapable of producing structured output and the approach should be abandoned","The field should be removed from the schema since it cannot be reliably populated","The underlying instructions or schema description for that field may be ambiguous or contradictory, not just a transient model error"],"correct":3,"exp":"Consistent failure on the same field across retries points to an ambiguous or contradictory schema/instruction, not randomness — the fix is clarifying the definition, not just adding more retries or removing the field."},{"domain":"Prompt Engineering & Structured Output","q":"When is prompt-based guidance (instructions alone, without schema enforcement) an acceptable choice for structured output?","options":["Whenever the output needs to be parsed programmatically with zero tolerance for errors","Only when using older Claude models that don't support tool use","When the downstream use case can tolerate occasional format deviations and doesn't require guaranteed parseability","Prompt-based guidance should never be used under any circumstances"],"correct":2,"exp":"Prompt-based guidance is reasonable when occasional deviation is tolerable; it's the wrong choice when downstream automation needs guaranteed structure, which is where programmatic enforcement is required instead."},{"domain":"Tool Design & MCP Integration","q":"A tool named 'search' accepts a single 'query' string parameter but is used for three very different purposes (web search, file search, and database lookup) depending on context clues in the query text. What design issue does this illustrate?","options":["An overloaded tool interface that would benefit from being split into distinct, purpose-specific tools with clearer names and parameters","This is an efficient design since it minimizes the total number of tools exposed to the model","The issue is with the model's reasoning, not the tool design","Adding more examples to the system prompt is the only way to fix this"],"correct":0,"exp":"A single overloaded tool inferring intent from context is a classic design smell — splitting into purpose-specific tools with clear names/parameters improves call accuracy far more reliably than prompting around an ambiguous interface."},{"domain":"Tool Design & MCP Integration","q":"An MCP client needs to discover what tools, resources, and prompts a server exposes before using them. What mechanism does MCP provide for this?","options":["The client must hardcode the list of available tools in advance with no runtime discovery","MCP servers broadcast their tools over a separate, unrelated network protocol","A capabilities negotiation and discovery process that occurs as part of the client-server connection","Discovery is only possible by manually reading the server's source code"],"correct":2,"exp":"MCP defines a capabilities negotiation/discovery process as part of establishing the connection, so clients can learn what's available at runtime rather than needing hardcoded knowledge or source access."},{"domain":"Tool Design & MCP Integration","q":"A remote MCP server using HTTP streaming needs to notify a connected client of a long-running operation's progress. Which capability makes this possible?","options":["The client must poll the server repeatedly on a separate connection since streaming updates aren't supported","The transport supports streaming updates over the connection rather than only a single request/response","Progress updates require switching to stdio transport, which is the only one that supports them","MCP has no mechanism for communicating progress on long-running operations"],"correct":1,"exp":"HTTP streaming transport is specifically suited to sending incremental updates over an open connection, which is why it supports progress notifications more naturally than a single-shot request/response model."},{"domain":"Tool Design & MCP Integration","q":"You're reviewing a tool schema where a required parameter has no description and an ambiguous name like 'val'. What's the most likely downstream consequence?","options":["No consequence — Claude always infers parameter meaning correctly regardless of naming","The tool will fail to register with the client entirely","This only affects human developers reading the code, not the model's tool calls","Claude may call the tool with incorrect or inconsistent values because the parameter's purpose isn't clear from the schema alone"],"correct":3,"exp":"Poorly named, undocumented parameters are a direct cause of incorrect or inconsistent tool calls, since the model relies on the schema (names, descriptions) to understand intended usage."},{"domain":"Context Management & Reliability","q":"A production agent handles multi-turn conversations that sometimes run for hours. Without intervention, what's the most likely failure mode as the conversation grows?","options":["Older but still-relevant context gets pushed out or truncated, degrading the agent's ability to reference earlier decisions","The agent will always produce shorter responses over time regardless of content","API costs will decrease steadily as the conversation continues","The conversation will automatically compact itself with no design work required"],"correct":0,"exp":"Without an explicit compaction/summarization strategy, growing conversations risk truncating relevant earlier context — this doesn't happen automatically and isn't primarily a cost or response-length issue."},{"domain":"Context Management & Reliability","q":"A workflow sends a large, mostly-static system prompt with every API call alongside a small amount of changing user content. Which optimization is most directly applicable?","options":["Shortening the user content instead, since the system prompt cannot be optimized","Switching to a smaller model to offset the token cost","Removing the system prompt entirely to reduce token usage","Marking the static portion with a cache_control breakpoint so it can be reused across calls"],"correct":3,"exp":"A large static prefix reused across calls is exactly the scenario cache_control breakpoints are designed for — caching that unchanging portion cuts cost and latency without touching the prompt's content."},{"domain":"Context Management & Reliability","q":"An agent's context compaction strategy summarizes older turns but repeatedly drops a critical early constraint the user specified, causing later errors. What does this suggest about the compaction approach?","options":["Compaction should be disabled entirely for all long conversations going forward","The summarization step isn't reliably preserving key decisions/constraints and needs to explicitly flag and retain them","The user should repeat the constraint in every single message instead","This is unavoidable and inherent to any form of context compaction"],"correct":1,"exp":"The problem is a compaction design flaw — summarization needs to explicitly identify and preserve critical constraints/decisions, not drop them. Disabling compaction entirely or offloading the burden to the user avoids fixing the actual issue."},{"domain":"Agentic Architecture & Orchestration","q":"A proposed design runs a bank's compliance checks on every customer interaction using subagents, while customer database lookups run through directly-called deterministic server code. A review flags this as backwards. Why?","options":["Subagents cannot call any tools, so they are structurally incapable of running compliance checks","Subagents provide weaker deterministic guarantees than server-side code, so the highest-consequence path (compliance) should run on the strongest guarantee, not the weakest","Database lookups are inherently higher-consequence than compliance checks, so the assignment should be reversed for that reason alone","There is no issue; subagents and server-side code offer identical reliability guarantees"],"correct":1,"exp":"The failure pattern here is a high-consequence path (compliance) assigned to the entry point/mechanism with the weakest deterministic guarantees. Work that most needs code-level certainty should run on deterministic server-side code, not a more flexible, judgment-based subagent."},{"domain":"Tool Design & MCP Integration","q":"A team defaults to exposing a new customer database through an MCP server because MCP was used on their last project, even though only one internal application will ever call it. What does this illustrate?","options":["Correct MCP usage, since MCP should be the default integration layer for any new data source","MCP earning its place only when the same tool entry point is reused across multiple clients; with only one consumer, the protocol layer adds integration cost without a matching benefit","A security improvement, since MCP always adds encryption that a direct API call lacks","An unrelated concern, since MCP has no cost implications regardless of client count"],"correct":1,"exp":"MCP's value comes from standardizing access for multiple clients that need to reach the same tools/data. When there's only one consumer, that reusability payoff doesn't exist, and the team is paying integration cost for a capability the project doesn't need."},{"domain":"Claude Code Configuration & Workflows","q":"An architecture handoff put Claude Code on branch employees' laptops for a banking task, even though those employees don't use terminals. What step, if done first, would have prevented this mismatch?","options":["Naming the end user and the actual workflow before selecting an entry point, so the interface choice is constrained by who will use it and how","Selecting the model version before any other design decision","Writing the CLAUDE.md file before deciding on the entry point","Choosing the delivery route (e.g., Bedrock vs. direct API) before naming the entry point"],"correct":0,"exp":"The root failure was choosing the entry point before the user was named. Branch staff needed an interface fitting a banking workflow, not a developer tool — that constraint should have determined the entry point before any other decision, including model or delivery-route choices."},{"domain":"Context Management & Reliability","q":"A support-reply prompt asset places a customer's ticket text and a variable manual excerpt before the system's tone guidelines and output schema, which are otherwise identical on every call. What's the consequence for a high-volume operation?","options":["None, since prompt caching only depends on total token count, not where content is placed","The cache hit rate suffers, because caching requires an exact matching prefix from the start of the prompt, and putting variable content first breaks that shared prefix on every single call","The output schema will silently stop being enforced whenever caching is enabled","This actually improves caching, since variable content should always be placed first"],"correct":1,"exp":"Prompt caching depends on an exact-matching prefix starting from the beginning of the prompt. Placing variable content (ticket, excerpt) before the stable instructions means no two calls share an identical prefix, so the cache essentially never hits — exactly backwards from how a high-volume operation should be structured."},{"domain":"Prompt Engineering & Structured Output","q":"A prompt asset tells Claude in plain instructions never to promise a refund, but a review wants a guarantee stronger than the model choosing to follow that sentence. What should be added?","options":["A longer, more emphatic version of the same instruction repeated three times in the prompt","An output schema with a closed set of allowed actions (none of which authorize a refund) plus a boolean flag the calling code validates before any reply is sent, rejecting the draft if it's ever true","Increasing the model's temperature so refusals happen more often","Removing the refund topic from the training data used to fine-tune the model"],"correct":1,"exp":"A stated instruction is guidance the model may or may not perfectly follow every time. A structural guarantee lives in the output contract — a closed action enum with no refund-authorizing value, plus a boolean the code checks and gates on — so enforcement doesn't depend on the model's compliance with a sentence."},{"domain":"Claude Code Configuration & Workflows","q":"A prompt asset used hundreds of times a day needs its output-validation logic to travel with it and update in lockstep whenever the policy changes, rather than living in a separate document reps might forget to check. What packaging choice fits?","options":["A plain text template that reps copy and paste into their own tool each time","A versioned Skill that bundles the prompt instructions together with the validation script, so an update to either ships as one package","An emailed PDF describing the policy, separate from the prompt itself","No packaging at all, relying on each rep to remember the current rules from memory"],"correct":1,"exp":"A Skill is a versioned, reusable unit that packages instructions plus optional scripts together. Bundling the validation logic with the prompt itself means a policy update is a single version bump that travels with the asset, unlike a template (just text, no enforcement) or documentation kept separately that's easy to fall out of sync with."}],"domainWeights":{"Agentic Architecture & Orchestration":0.27,"Claude Code Configuration & Workflows":0.2,"Prompt Engineering & Structured Output":0.2,"Tool Design & MCP Integration":0.18,"Context Management & Reliability":0.15},"testSize":20,"strongAt":18,"solidAt":14,"historyKey":"ccarf_practice_history","subtitle":"Pulls a fresh, randomized 20-question set each time from a 46-question bank, weighted to the real exam's domain proportions (27/20/20/18/15). Distractors are length-balanced and answer positions shuffled. Your score history is saved in this browser.","caveat":"Domain weights and format reflect the CCAR-F exam blueprint. Most questions are original, written to match documented domain topics — not reproductions of real exam content."},"CCAR-P":{"label":"CCAR-P (Professional)","accent":"#d97757","accentHover":"#c56344","questionBank":[{"domain":"Integration","q":"A team is building a RAG pipeline over a large corpus of highly structured legal contracts, where each clause has a distinct heading and cross-references to other clauses by section number. Which chunking strategy is most appropriate?","options":["Fixed-size chunking with a uniform token count regardless of document structure","Chunking the entire document as a single unit regardless of length","Structure-aware chunking that respects clause/section boundaries and preserves cross-reference context","Random sampling of paragraphs to reduce index size"],"correct":2,"exp":"Structure-aware chunking that respects natural document boundaries (clauses, sections) preserves semantic coherence and cross-reference context, which matters a lot for structured legal text. Fixed-size or random chunking risks splitting clauses mid-thought and losing the cross-reference relationships that matter for retrieval quality."},{"domain":"Integration","q":"An enterprise wants to connect Claude to a dozen internal tools (ticketing, CRM, internal wiki, deployment systems) used by different engineering teams. What integration approach best supports least-privilege access and scalable governance?","options":["Expose each tool through its own scoped MCP server with narrowly defined permissions per tool","Grant a single service credential with full access to all systems for simplicity","Have Claude directly execute raw shell commands against each system's API","Bundle all tool logic into one large custom function with a single shared credential"],"correct":0,"exp":"Scoped MCP servers per tool/system, each with narrow permissions, is the standard pattern for least-privilege access at enterprise scale — it isolates blast radius and keeps governance manageable, unlike a single broad credential or one monolithic integration."},{"domain":"Integration","q":"A production agent occasionally calls a tool with a valid but overly broad permission scope, able to delete records it should only be able to read. What's the most direct architectural fix?","options":["Trust the agent's judgment and rely on prompt instructions not to delete records","Remove all tools from the agent to eliminate risk entirely","Increase model temperature so the agent behaves more conservatively","Reduce the tool's granted permissions to match only what the task actually requires (least privilege)"],"correct":3,"exp":"Over-broad tool permissions are a security/architecture defect, not a prompting problem — the fix is scoping the tool's actual granted permissions to the minimum required, not hoping the model self-restrains."},{"domain":"Integration","q":"You're deciding between exposing enterprise data to Claude via MCP versus building custom direct API integrations. What's the key advantage MCP offers in this context?","options":["MCP is always faster than any direct API call under all conditions","MCP provides a standardized interface and discovery mechanism that reduces bespoke integration work across multiple clients and tools","MCP eliminates the need for authentication entirely","MCP guarantees zero latency regardless of network conditions"],"correct":1,"exp":"MCP's value is standardization and discovery — multiple clients can connect to the same tools/data without each needing a bespoke integration, which is the real integration-cost savings, not a raw performance guarantee."},{"domain":"Integration","q":"A monitoring system needs to track an agent's tool-calling behavior across a distributed multi-agent deployment spanning several services. What should the observability strategy prioritize?","options":["End-to-end tracing that correlates tool calls, latencies, and errors across agents and services","Logging only final outputs, since intermediate tool calls are not useful for debugging","Disabling logging in production to reduce overhead","Manually reviewing a random sample of conversations once per quarter"],"correct":0,"exp":"Distributed multi-agent systems need correlated end-to-end tracing (tool calls, latency, errors) to be debuggable and operable at scale — logging only final outputs or infrequent manual sampling won't surface the failure patterns that matter."},{"domain":"Integration","q":"A team must choose between progressive tool discovery (Claude requests tool definitions as needed) and loading a large monolithic set of tool definitions upfront. When does progressive discovery matter most?","options":["When the total number of available tools is very small and context is not a constraint","Progressive discovery is never beneficial and should be avoided in all architectures","Only when using a model with no tool-use capability","When the number of available tools is large enough that loading all definitions upfront would consume excessive context and increase cost/latency"],"correct":3,"exp":"Progressive discovery earns its complexity when a large tool catalog would otherwise bloat context with mostly-unused definitions — for small tool sets, upfront loading is simpler and the tradeoff isn't worth it."},{"domain":"Solution Design & Architecture","q":"A global retailer needs Claude to extract shipment costs from freight quotes, validate them against procurement policy, and generate a recommendation — with each stage depending on the previous stage's output and requiring auditability. Which architecture pattern fits best?","options":["A single monolithic prompt that autonomously decides what processing is needed","A fixed, sequenced workflow with discrete steps for extraction, validation, and recommendation","An autonomous agent that dynamically creates its own plan and tool selection each run","Parallel independent calls that extract, validate, and recommend simultaneously without waiting on each other"],"correct":1,"exp":"When stages have strict dependencies and the business needs predictability and auditability, a fixed workflow with discrete sequenced steps is the right pattern — autonomous or parallel approaches sacrifice the predictability this use case requires."},{"domain":"Solution Design & Architecture","q":"A business wants to justify a proposed Claude-powered solution to leadership. Which framing best connects the architecture to business value?","options":["Describing the solution purely in terms of which Claude model and API endpoints are used","Focusing the pitch entirely on the novelty of using AI without connecting to business metrics","Tying specific architectural choices to measurable outcomes like productivity gains, cost reduction, or performance targets","Avoiding any discussion of tradeoffs to keep the presentation simple"],"correct":2,"exp":"Solution design at the Professional level is judged by whether architectural choices are explicitly connected to measurable business outcomes — technical detail alone, or novelty framing without metrics, doesn't demonstrate that connection."},{"domain":"Solution Design & Architecture","q":"A task requires the system to independently decide, on a case-by-case basis, which tools to invoke and in what order, because inputs vary too much for a fixed sequence to work. Which pattern is most appropriate?","options":["An agentic pattern where the system plans and selects tools dynamically based on the specific input","A fixed, rigidly sequenced workflow with no branching","A single non-agentic prompt with no tool access at all","Parallel execution of all possible tool calls regardless of relevance"],"correct":0,"exp":"When inputs vary enough that a fixed sequence can't anticipate the right steps, an agentic pattern (dynamic planning and tool selection) is the appropriate architecture — a rigid workflow would break on the variability this case describes."},{"domain":"Solution Design & Architecture","q":"When decomposing a complex business problem into a multi-agent system, what's the primary risk of creating too many narrowly-scoped agents?","options":["Narrow agents are always more accurate regardless of coordination overhead","Narrow agents cannot be given any tools","There is no risk — more agents is always strictly better","Coordination and hand-off overhead between agents can outweigh the benefit of narrow specialization"],"correct":3,"exp":"Over-decomposition introduces coordination overhead (hand-offs, context passing, orchestration complexity) that can outweigh the benefits of specialization — decomposition should match the problem's natural structure, not maximize agent count."},{"domain":"Solution Design & Architecture","q":"A workflow needs to summarize a document and then answer follow-up questions about it in the same session, with no branching logic or tool calls required. Which pattern is the simplest fit?","options":["A full multi-agent orchestration with a dedicated coordinator","An augmented LLM pattern — a single model call with relevant context, no agentic loop needed","A hub-and-spoke design with several specialized subagents","An autonomous agent with a dynamic planning loop"],"correct":1,"exp":"When there's no branching or tool-use complexity, the simplest sufficient pattern (an augmented LLM — direct context plus a single call) is the right architectural choice; multi-agent or agentic-loop patterns would be unnecessary overhead here."},{"domain":"Solution Design & Architecture","q":"An architecture review flags that a proposed system routes every request, regardless of complexity, through the most expensive and highest-latency model available. What does this suggest about the design?","options":["The design is missing tiered model routing — matching model choice to task complexity would reduce cost and latency without sacrificing quality where it isn't needed","This is optimal because using the best model everywhere maximizes quality","The issue is unrelated to architecture and is purely a pricing negotiation problem","Using one model everywhere is required for consistency and cannot be improved"],"correct":0,"exp":"Routing every request through the most expensive model regardless of complexity is a design smell — tiered routing (matching model cost/capability to task difficulty) is the standard architectural fix for cost and latency without sacrificing necessary quality."},{"domain":"Evaluation, Testing & Optimisation","q":"A team wants to evaluate a Claude-powered customer support system before production rollout. What should the evaluation dataset prioritize to be representative?","options":["Only the easiest, most common support tickets to ensure high pass rates","A single synthetic example repeated many times for statistical significance","A mix of common cases, edge cases, and known failure-prone scenarios that reflect real production traffic","Only tickets the team already knows the system handles correctly"],"correct":2,"exp":"A representative eval dataset needs to include common cases, edge cases, and known failure modes — cherry-picking easy cases or only-known-good examples gives a false sense of readiness and hides real production risk."},{"domain":"Evaluation, Testing & Optimisation","q":"After deployment, a system's response quality seems to be degrading over time, but no one can pinpoint why. What's the most likely missing piece?","options":["A larger context window, which always fixes quality degradation","Ongoing logging and observability that would surface drift, failure patterns, or upstream data changes","Switching to a more expensive model without further investigation","Reducing the system's tool access to zero"],"correct":1,"exp":"Without ongoing logging/observability, quality regressions are invisible until they're severe — the fix starts with instrumentation to detect and diagnose drift, not jumping straight to a model swap or blunt tool removal."},{"domain":"Evaluation, Testing & Optimisation","q":"A team is comparing two prompt variants for the same task and wants statistically sound evidence of which performs better in production. What approach is most appropriate?","options":["Deploy the variant the team personally prefers without measurement","Alternate between variants randomly with no tracking of which variant produced which result","Ask Claude itself which prompt is better and accept that as ground truth","Run a structured A/B test with clear success metrics and adequate sample size before deciding"],"correct":3,"exp":"A structured A/B test with defined metrics and adequate sample size is the standard way to get statistically sound evidence — untracked alternation or subjective preference doesn't produce evidence a production decision can be based on."},{"domain":"Evaluation, Testing & Optimisation","q":"A system exhibits occasional hallucinated facts in otherwise well-formed responses. What's the most useful next diagnostic step before making a fix?","options":["Analyze the specific failure cases to determine whether the issue is retrieval gaps, prompt ambiguity, or a genuine model limitation","Immediately switch to a completely different model without further analysis","Assume the issue is unfixable and disable the feature entirely","Increase the response length limit, which is unrelated to hallucination causes"],"correct":0,"exp":"Diagnosing hallucination requires distinguishing root causes (missing/poor retrieval context, ambiguous prompting, or genuine model limitation) — jumping straight to a model swap or disabling the feature skips the diagnostic step that determines the right fix."},{"domain":"Evaluation, Testing & Optimisation","q":"A cost-optimization review finds that most of a system's token spend comes from re-sending a large, unchanged system prompt and reference document on every request. What's the most direct optimization?","options":["Shorten user messages instead, since the system prompt is assumed fixed cost","Switch to a model with a smaller context window to force shorter prompts","Apply prompt caching to the static system prompt and reference content so it isn't re-processed at full cost on every call","Remove the reference document entirely regardless of whether it's needed"],"correct":2,"exp":"Prompt caching is designed exactly for this pattern — large, static content reused across calls — and directly reduces token cost and latency without requiring content removal or unrelated context-window changes."},{"domain":"Governance, Safety & Risk Management","q":"A production system needs to screen every model output for policy violations (toxicity, PII exposure) before returning it to the user, but running the primary large model multiple times for this check is too slow and expensive. What's the better architectural pattern?","options":["Run the primary expensive model three times and take a majority vote on safety","Pass the output through an independent, fast, low-cost model running asynchronously as a dedicated safety classifier","Skip safety screening in production to preserve latency","Only screen a random 1% sample of outputs and accept the rest without review"],"correct":1,"exp":"The standard production pattern is an independent, low-latency, low-cost model (like a smaller model) acting as a dedicated async classifier for safety checks — repeatedly re-running the expensive primary model for voting is costly and slow, and skipping or sampling safety checks is a governance failure."},{"domain":"Governance, Safety & Risk Management","q":"A team is deploying an agent that can take real-world actions (sending emails, modifying records) based on Claude's output. What governance control is most important before granting this capability?","options":["Human-in-the-loop review and approval for high-impact or irreversible actions before they execute","No control is needed since the model is generally reliable","Granting the agent unrestricted permissions to move faster","Logging the action only after it has already been executed"],"correct":0,"exp":"For high-impact or irreversible actions, human-in-the-loop approval before execution is the standard governance control — post-hoc logging alone doesn't prevent harm, and unrestricted permissions or no controls at all are the opposite of responsible deployment."},{"domain":"Governance, Safety & Risk Management","q":"A healthcare organization wants to deploy a Claude-powered system that processes patient data. Which consideration is most directly a compliance requirement rather than a general best practice?","options":["Making responses sound more empathetic","Using the largest available model for best response quality","Minimizing the number of words in each response","Ensuring the system meets HIPAA requirements around patient data handling and access controls"],"correct":3,"exp":"HIPAA compliance for patient data handling is a hard regulatory requirement in this context, distinct from general UX or model-selection best practices which, while useful, aren't compliance obligations."},{"domain":"Governance, Safety & Risk Management","q":"An internal audit flags that a deployed agent has tool permissions far broader than what its actual use cases require. What risk does this primarily represent?","options":["No real risk, since broader permissions only improve flexibility","A cost-only concern with no security implications","An expanded attack surface and blast radius if the agent is manipulated (e.g., via prompt injection) into misusing those permissions","A UI/UX issue unrelated to security or governance"],"correct":2,"exp":"Over-provisioned permissions increase the potential damage if an agent is compromised or manipulated (such as through prompt injection) — this is a core governance/security concern, not just a flexibility or cost tradeoff."},{"domain":"Governance, Safety & Risk Management","q":"A team wants to reduce the risk of biased or unfair outcomes from a Claude-powered decision-support tool used in hiring. What should the governance process include?","options":["Structured bias and fairness review of outputs across different demographic groups, with human oversight on final decisions","Assuming the model is neutral by default and skipping bias review","Removing all human review to eliminate human bias entirely","Using the tool only for final, unreviewed hiring decisions to save time"],"correct":0,"exp":"Responsible deployment in a sensitive domain like hiring requires structured bias/fairness review across groups plus human oversight on final decisions — assuming neutrality or removing human review entirely both increase risk rather than reduce it."},{"domain":"Stakeholder Communication & Lifecycle Management","q":"During the discovery phase of a new Claude-powered solution, which group's requirements are most important to gather beyond the primary business sponsor?","options":["Only the business sponsor's requirements matter at this stage","Technical, legal, security, and operational stakeholders, since their constraints shape what's actually deployable","No one else needs to be consulted until after the system is built","Only the engineering team building the solution"],"correct":1,"exp":"Discovery needs input from technical, legal, security, and operational stakeholders in addition to the business sponsor — constraints from these groups (compliance, infrastructure, support burden) often materially change what's actually deployable."},{"domain":"Stakeholder Communication & Lifecycle Management","q":"A solution architect needs to explain a complex multi-agent design to a non-technical executive audience. What's the most effective approach?","options":["Present the full technical architecture diagram with no simplification","Avoid the conversation entirely since executives don't need to understand architecture","Use as much technical jargon as possible to demonstrate expertise","Translate the design into business outcomes and tradeoffs (cost, risk, timeline) rather than technical implementation detail"],"correct":3,"exp":"Communicating to non-technical stakeholders means translating architecture into business terms — outcomes, tradeoffs, risk, cost — rather than technical depth or jargon, which the audience isn't positioned to evaluate."},{"domain":"Stakeholder Communication & Lifecycle Management","q":"A production system has been live for six months. What lifecycle activity is most important at this stage that wasn't relevant during initial design?","options":["Re-running the original discovery interviews from scratch","Ignoring the system entirely since it was already deployed successfully","Ongoing monitoring, stakeholder feedback collection, and continuous improvement based on real production behavior","Rebuilding the system from zero regardless of current performance"],"correct":2,"exp":"Post-launch lifecycle management is about ongoing monitoring, feedback, and iterative improvement based on real usage — not repeating discovery from scratch or abandoning the system, and not rebuilding without cause."},{"domain":"Stakeholder Communication & Lifecycle Management","q":"A stakeholder asks why a proposed Claude solution will take three months instead of the two weeks they expected. What's the best way to manage this expectation gap?","options":["Clearly explain the specific tradeoffs and dependencies (integration complexity, evaluation, governance review) driving the timeline","Avoid giving a real timeline to sidestep the conflict","Agree to the two-week timeline regardless of feasibility","Blame the engineering team without explaining the underlying reasons"],"correct":0,"exp":"Managing expectation gaps requires transparently explaining the specific tradeoffs and dependencies behind the timeline — agreeing to an infeasible deadline or avoiding the conversation both erode trust and set the project up to fail."},{"domain":"Stakeholder Communication & Lifecycle Management","q":"During implementation handoff to an operations team, what documentation is most critical to include?","options":["Only the original sales pitch deck used to win the project","No documentation is needed if the original architect remains available indefinitely","A single-page summary with no technical detail at all","Architecture decisions, operational runbooks, monitoring/alerting setup, and known limitations"],"correct":3,"exp":"A proper handoff needs architecture rationale, operational runbooks, monitoring/alerting details, and known limitations — relying on the original architect's continued availability or providing no real documentation both create long-term operational risk."},{"domain":"Claude Models, Prompting & Context Engineering","q":"A system relies heavily on prompt caching to reduce cost, but cache hit rates are far lower than expected. The system fragments a large static knowledge base into small chunks and distributes them randomly through the prompt on each call. What's the likely cause?","options":["Prompt caching is unrelated to prompt structure and this behavior is unexplainable","Prompt caching requires exact prefix matching from the start of the prompt; fragmenting and randomizing static content breaks the ability to match a stable prefix","The cache is working correctly and no further action is needed","Cache hit rate is determined solely by total token count, not content placement"],"correct":1,"exp":"Prompt caching relies on exact prefix matching starting from the beginning of the prompt. Static content needs to be structured consistently at the prefix (e.g., large knowledge bases, system instructions first) — fragmenting and randomizing it breaks prefix matching and tanks the cache hit rate."},{"domain":"Claude Models, Prompting & Context Engineering","q":"A task requires classifying thousands of short customer messages per hour into a fixed set of categories, with tight latency and cost constraints. Which model selection approach fits best?","options":["Use a smaller, faster, lower-cost model suited to the task's actual complexity and volume","Always use the most capable, highest-reasoning model available regardless of task simplicity","Randomly alternate between all available models","Use the largest context window model regardless of how short the inputs are"],"correct":0,"exp":"High-volume, latency-sensitive, relatively simple classification tasks are a textbook case for matching model choice to task complexity — a smaller, faster, cheaper model is the right fit, not defaulting to the most capable (and most expensive) option."},{"domain":"Claude Models, Prompting & Context Engineering","q":"A team wants multiple engineering teams to reuse a consistent set of instructions for a recurring task (e.g., code review conventions) without repeating them in every prompt. What's the best mechanism?","options":["Have each engineer retype the same instructions manually every time","Store the instructions in an email thread for reference","Define the instructions as a reusable Claude Skill that can be invoked consistently across teams","Avoid standardizing instructions to preserve flexibility"],"correct":2,"exp":"Claude Skills exist specifically to package reusable instructions/resources for recurring tasks, letting teams invoke consistent behavior without duplicating instructions in every prompt."},{"domain":"Claude Models, Prompting & Context Engineering","q":"A long-running conversation is approaching its context limit, and important early constraints risk being pushed out. What context engineering technique directly addresses this?","options":["Ignore the issue since context limits rarely matter in practice","Prioritize and preserve critical instructions/decisions while summarizing or removing less relevant older content","Always discard the most recent messages instead of older ones","Switch to a model with no stated context limit, which doesn't exist as a real option"],"correct":1,"exp":"Context engineering at scale means actively prioritizing what stays in context — preserving critical constraints and decisions while trimming less relevant history — rather than passively hoping limits won't matter."},{"domain":"Claude Models, Prompting & Context Engineering","q":"A prompt uses several worked examples to demonstrate the desired output format for an unusual classification taxonomy. Which prompting technique is being applied?","options":["Zero-shot prompting","Retrieval-augmented generation","Few-shot prompting","Prompt caching"],"correct":2,"exp":"Providing worked examples to demonstrate a desired pattern is the definition of few-shot prompting — distinct from zero-shot (no examples), RAG (retrieval of external content), or caching (a cost/latency optimization, not a prompting technique)."},{"domain":"Developer Productivity & Operational Enablement","q":"An organization wants to standardize Claude Code configuration across engineering teams while preventing individual developers from overriding critical security settings. What's the best mechanism?","options":["Use server-managed settings that enforce organization-wide controls and prevent local overrides","Publish recommended settings in a document and hope teams follow them voluntarily","Allow each developer to configure settings independently with periodic audits after the fact","Avoid setting any organization-wide policy to maximize developer freedom"],"correct":0,"exp":"Server-managed settings that enforce controls and prevent local overrides is the standard mechanism for guaranteeing organization-wide policy compliance — voluntary guidance or after-the-fact audits don't prevent the problem, just detect it later."},{"domain":"Developer Productivity & Operational Enablement","q":"A team wants to use Claude Code to help speed up debugging of a production incident. What's the most effective use in this context?","options":["Using Claude Code only for writing documentation, never for active debugging","Avoiding Claude Code entirely during incidents due to reliability concerns","Using Claude Code exclusively to write unit tests unrelated to the incident","Having Claude Code investigate logs, reproduce the issue, and suggest fixes as part of the debugging workflow"],"correct":3,"exp":"Claude Code's value during an incident includes actively assisting with investigation, reproduction, and fix suggestions — restricting it to unrelated tasks or avoiding it entirely wastes a legitimate operational tool."},{"domain":"Developer Productivity & Operational Enablement","q":"An organization wants to distribute approved tools, skills, and MCP servers to engineering teams in a centrally managed way rather than letting each team source their own. What approach fits best?","options":["Letting each team independently discover and install whatever tools they find online","A managed plugin marketplace that distributes approved, vetted tools/skills/MCP servers across teams","Disabling all tool use organization-wide to avoid the question entirely","Requiring a manual email request for every single tool installation with no central catalog"],"correct":1,"exp":"A managed plugin marketplace is the standard pattern for centrally distributing vetted, approved tools/skills/MCP servers at scale — ad hoc team-level sourcing or all-manual processes don't scale and undermine governance."},{"domain":"Solution Design & Architecture","q":"A Claude-powered pipeline produces a slightly different categorization for the same input across two separate runs, with no code or data changes. What does this most directly call for?","options":["A code rollback, since any output variation between runs indicates a regression bug","A permanent switch to a different model, since output variation signals the current model is broken","An evaluation framework that measures behavior across many runs, since non-determinism means a single observed run can't certify behavior","No action, since run-to-run variation never has architectural implications"],"correct":2,"exp":"Non-determinism means the same input can produce different outputs across runs. Because a single run isn't proof of reliable behavior, evaluation frameworks that sample across many runs are what let an architect actually certify behavior — this is why non-determinism is why evaluation frameworks exist."},{"domain":"Solution Design & Architecture","q":"An architect is deciding how to handle a domain where information changes weekly and much of it is private to the organization. Per the model's knowledge-boundary property, what's the appropriate design response?","options":["Route those lookups through retrieval, tools, or MCP so an external system — not the model's training data — is the source of truth","Rely on the model's training data as the source of truth, since Claude is generally reliable on all topics","Increase the temperature setting so the model produces more confident answers on unfamiliar topics","Avoid the domain entirely, since fast-changing or private information can never be handled by a Claude-based solution"],"correct":0,"exp":"The model is reliable on topics that are common, recent, and consistent in training data, and unreliable on topics that are rare, private, or fast-changing. For those unreliable topics, retrieval, tools, and MCP make an external system the source of truth instead of the model itself."},{"domain":"Solution Design & Architecture","q":"A long-running agent session keeps appending every tool result and intermediate message to the conversation without ever trimming or restructuring it. Which design principle is being violated?","options":["Least privilege, since tool permissions should always be minimized regardless of session length","Progressive disclosure, which only concerns how tools are named in a user interface","Statelessness, since agents are required to discard all prior turns after each tool call","Context as a finite resource — the context window is a hard edge with a fixed token budget, so what's kept, reordered, or left out is a design decision, not something to leave unmanaged"],"correct":3,"exp":"The context window has a fixed token budget. What you put in it, in what order, and what you leave out are design decisions that affect both what the model can work with and what the session costs to run — this is what feeds model and context strategy work later."},{"domain":"Solution Design & Architecture","q":"A system's outputs are fluent and consistently confident in tone, but occasionally factually wrong in ways that are hard to catch by reading the response alone. What architectural principle does this illustrate?","options":["Knowledge boundary — the fix is always to fine-tune the model on more recent data","Confidence is not validity — a fluent, assured tone doesn't mean the answer is correct, so human-in-the-loop placement and verification need to be deliberate architectural choices, not an afterthought","Context as a finite resource — the fix is to shorten every prompt regardless of task","Non-determinism — the fix is to disable all sampling and force a single greedy output"],"correct":1,"exp":"Claude can produce a wrong answer in the same fluent, assured tone it uses for a right one. This is exactly why human-in-the-loop placement and verification have to be deliberate architecture decisions rather than afterthoughts."},{"domain":"Solution Design & Architecture","q":"A proposal puts Claude Code — an interface built for developers running a terminal — directly in front of non-technical bank branch staff following a fixed workflow. What architectural mistake does this represent?","options":["Choosing the wrong delivery route, since Claude Code determines whose cloud infrastructure the request runs on","A tool-permission scoping error unrelated to which interface the end user sees","Collapsing the entry-point decision (chosen for the user and the work) with the build-time interface (chosen for the engineering team), when the two should be evaluated separately for who is actually interacting with Claude","A context-window sizing error, since Claude Code has a smaller context window than the API"],"correct":2,"exp":"An entry point is chosen for the user and the work; a build-time interface is chosen for the engineering team and the integration. Claude Code was built for developers, not workflow-following branch staff — treating the three layers as interchangeable and picking a developer-facing interface for a non-technical audience is the exact failure mode the platform map is meant to prevent."},{"domain":"Solution Design & Architecture","q":"A partner's compliance posture requires all model inference to run on their existing AWS infrastructure rather than calling Anthropic's API endpoints directly. Which layer of the platform map does this decision belong to?","options":["Delivery route — it determines whose infrastructure the API traffic terminates on, e.g. Anthropic directly, AWS Bedrock, GCP Vertex AI, or Microsoft Foundry","Entry point — it determines which person or system directly interacts with Claude","Build-time interface — it determines which SDK the engineering team writes code against","Agent Team composition — it determines how many subagents coordinate on the task"],"correct":0,"exp":"Delivery routes are about where API traffic terminates — whose infrastructure runs the request. A compliance requirement to run on existing AWS infrastructure is a delivery-route decision (AWS Bedrock), chosen for the partner's cloud commitments and compliance posture, distinct from entry points or build-time interfaces."},{"domain":"Solution Design & Architecture","q":"A team needs to guarantee that a specific compliance check runs on every single tool call an agent makes, with no way for the model to skip it. Which primitive is purpose-built for this?","options":["Skills, since they package a reusable procedure the model can choose to follow","Hooks, since they are deterministic code that fires on defined events to enforce a rule the model cannot skip","Subagents, since they isolate a task into a separate context","Dynamic Workflows, since they assemble workflow steps at runtime"],"correct":1,"exp":"Hooks are deterministic code that fires on defined events to enforce a rule the model cannot skip — exactly the primitive for a compliance check that must run every time, independent of the model's judgment."},{"domain":"Solution Design & Architecture","q":"A team wants to package a versioned, reusable set of instructions and optional scripts so multiple projects can invoke the same repeatable procedure consistently. Which primitive fits, and how does it differ from a subagent?","options":["A subagent — subagents package a versioned, reusable procedure the same way skills do","MCP — MCP is the mechanism for packaging reusable instructions into a versioned unit","A hook — hooks package reusable instructions as their primary job","A Skill — skills package a repeatable procedure as a versioned, reusable unit, while a subagent instead hands a scoped sub-task to a separate context to run in isolation or parallel"],"correct":3,"exp":"Skills are a versioned, reusable unit (instructions plus optional scripts) that packages a repeatable procedure. Subagents do a different job: they hand a scoped sub-task to a separate context so work can run in isolation or in parallel — packaging a procedure and isolating/parallelizing a sub-task are distinct primitives solving different problems."},{"domain":"Solution Design & Architecture","q":"While decomposing a solution, an architect assigns an exception-handling approval step — one where being right matters more than being fast — directly to Claude instead of a human reviewer. What does the three-owner decomposition framework say about this choice?","options":["It's correct,
