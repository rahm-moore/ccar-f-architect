since Claude should own every step that involves any judgment at all","It's correct, since existing systems should never be trusted with approval steps","It's a common architect mistake — approvals and exception paths where correctness matters more than speed belong to human judgment, and over-assigning this kind of work to Claude typically makes the process more expensive, slower, and harder, not better","It's irrelevant, since the three-owner framework only applies to systems that use subagents"],"correct":2,"exp":"The three-owner framework splits work between what Claude does (language understanding, summarization, planning, drafting, tool-mediated action), what existing systems do (already-reliable order-status services, policy engines, rules tables), and what humans do (judgment calls, exception paths, approvals). Collapsing all three into 'what Claude does' is a common mistake architects make."},{"domain":"Integration","q":"A partner wants Claude to query a live inventory database for stock levels during a customer chat, without giving the model direct database credentials. What integration pattern satisfies this?","options":["Embed the database password directly in the system prompt so Claude can connect natively","Expose a narrowly-scoped MCP tool or API endpoint that performs the lookup server-side and returns only the result, keeping credentials out of the model's context","Have Claude generate raw SQL and execute it directly against the production database","Disable tool use entirely and have a human manually check inventory for every chat"],"correct":1,"exp":"A scoped server-side tool/endpoint that performs the lookup and returns only the needed result keeps credentials out of the model's context entirely — far safer than embedding credentials or letting the model generate raw SQL against production."},{"domain":"Integration","q":"Two teams each build their own bespoke integration to the same internal ticketing system for their own Claude-powered assistants, duplicating auth handling and error logic. What would reduce this duplication going forward?","options":["Have each team keep maintaining separate integrations, since duplication doesn't affect maintenance cost","Merge both assistants into a single agent with no tools at all","Require every future integration to be written directly against the ticketing system's raw internal API with no abstraction layer","Expose the ticketing system once through a shared MCP server that both assistants (and future ones) can connect to, avoiding duplicated auth and error-handling logic"],"correct":3,"exp":"MCP's standardization value is exactly this: exposing a capability once through a shared server that multiple clients can reach, instead of each team re-building bespoke, duplicated integration logic."},{"domain":"Integration","q":"An agent's tool call to an external payment API times out intermittently under load, and there's currently no retry or backoff logic. What's the most direct integration fix?","options":["Add retry logic with exponential backoff and clear timeout handling around the external call, rather than letting a transient failure surface as a hard error","Remove the payment tool from the agent entirely to avoid the timeout","Increase the model's context window, which is unrelated to network timeout behavior","Switch the agent to a different model with no changes to the integration code"],"correct":0,"exp":"Intermittent timeouts under load are a classic case for retry-with-backoff and explicit timeout handling at the integration layer — a model swap or removing the tool doesn't address the actual network reliability problem."},{"domain":"Integration","q":"A company wants external partners to safely build their own integrations against an internal Claude-powered service without seeing its internal implementation details. What should the integration boundary expose?","options":["The full internal source code, so partners can modify the underlying service directly","Nothing at all, since external partners should never be able to integrate with internal services","A stable, documented interface (such as an MCP server or API) that exposes only the intended capabilities and hides internal implementation details","Direct access to the production database backing the service"],"correct":2,"exp":"A stable, documented interface that exposes only the intended capability — not internals — is the standard integration boundary. It lets partners build against a contract that won't break when internal implementation changes, unlike exposing source code or raw database access."},{"domain":"Integration","q":"An architecture connects Claude to fifteen different internal tools, and a security review wants to confirm no single compromised credential could affect every tool at once. What integration property should the review be checking for?","options":["That all fifteen tools share one broad service credential for operational simplicity","That each tool is scoped with its own narrow, independent credential/permission set, so a compromise of one doesn't cascade to the others","That the tools are merged into a single monolithic function to reduce the number of credentials","That credential rotation is disabled to avoid breaking any active sessions"],"correct":1,"exp":"Isolating credentials per tool (least privilege, scoped independently) limits blast radius — a compromised credential for one tool shouldn't cascade into access for the other fourteen. Sharing one broad credential is exactly the anti-pattern a security review should catch."},{"domain":"Evaluation, Testing & Optimisation","q":"A team's only evaluation for a new Claude-powered feature is manually reading ten example transcripts before launch. What's the main limitation of this approach?","options":["Reading transcripts is unnecessary since automated evals are always sufficient on their own","This approach guarantees production quality and needs no further eval investment","Ten hand-picked examples aren't statistically representative of production traffic and won't surface edge cases or rare failure modes at scale","Manual review is not allowed under any evaluation framework"],"correct":2,"exp":"A tiny, likely hand-picked sample can't represent the diversity of real production traffic, and won't surface the edge cases or rare failure modes that matter most — a representative, appropriately-sized eval set is needed alongside any manual spot-checking."},{"domain":"Evaluation, Testing & Optimisation","q":"After a prompt change, a team wants to know whether response quality actually improved or regressed, not just whether it 'feels different.' What should they rely on?","options":["A defined set of evaluation metrics measured consistently before and after the change, ideally with a structured comparison like an A/B test","A single team member's subjective impression after reading a few outputs","Whichever version produces longer responses, since length is a reliable quality proxy","Asking Claude to grade its own two versions with no defined criteria"],"correct":0,"exp":"Determining real improvement vs. regression requires defined, consistently-measured metrics and structured comparison — subjective impressions, response length, or ungrounded self-grading don't produce evidence a decision can be based on."},{"domain":"Evaluation, Testing & Optimisation","q":"A classification system's accuracy looks fine in aggregate, but the team suspects it performs much worse on one specific underrepresented input category. What should the evaluation process check?","options":["Nothing further — aggregate accuracy is sufficient on its own to certify any system","Only the categories that already have the most training examples","Whether the model's confidence score is high, since confidence implies balanced performance across categories","Segmented performance broken out by category, specifically including underrepresented ones, since aggregate metrics can mask poor performance on smaller slices of the data"],"correct":3,"exp":"Aggregate metrics can hide poor performance on smaller or underrepresented slices of the data. Segmenting evaluation by category (especially ones suspected to be weak) is how that kind of masked failure gets surfaced before it reaches production."},{"domain":"Evaluation, Testing & Optimisation","q":"A team wants to reduce the cost of running frequent evaluations across a large test set without giving up meaningful signal. What's a reasonable optimization?","options":["Eliminate evaluation entirely once the system passes its first review","Use a smaller, cheaper model as an automated grader for well-defined criteria, reserving human or expensive-model review for ambiguous or high-stakes cases","Run the full expensive primary model multiple times per test case regardless of cost","Reduce the test set to a single example to save on compute"],"correct":1,"exp":"Using a cheaper model as an automated grader for well-defined, easy-to-judge criteria — while reserving human or expensive-model review for genuinely ambiguous or high-stakes cases — keeps evaluation affordable without losing meaningful signal. Cutting eval entirely or shrinking the test set to one example loses the signal altogether."},{"domain":"Governance, Safety & Risk Management","q":"A Claude-powered agent has standing access to send emails on a company's behalf. A new policy requires that any email to an external customer be reviewed before sending, while internal emails can send automatically. How should this be enforced?","options":["A hook or gating check in the send-email tool path that requires approval specifically for external-recipient emails, enforced in code rather than left to prompt instructions alone","A note in the system prompt asking Claude to be careful with external emails, with no code-level enforcement","Removing email-sending capability entirely regardless of recipient","Requiring approval for every single email, internal or external, to simplify the policy"],"correct":0,"exp":"A policy that must always hold (external emails need review) should be enforced in code — a hook or gating check tied to the actual condition — rather than relying on the model to reliably follow a prompt instruction every time. Removing the capability entirely or blanket-requiring approval for everything both over-correct relative to the actual policy."},{"domain":"Governance, Safety & Risk Management","q":"A company deploying a Claude-powered tool in the EU needs to determine what user data protection obligations apply. Which consideration is the actual compliance driver here?","options":["Whether the product's marketing copy is engaging enough","Whether the model was trained using the largest possible dataset","Applicable data protection regulation such as GDPR, which governs how personal data can be collected, processed, and retained","Whether responses are generated quickly enough to satisfy user expectations"],"correct":2,"exp":"Data protection regulation like GDPR is a binding legal compliance driver for handling personal data in the EU — marketing tone, training data size, and response speed are unrelated to that specific compliance obligation."},{"domain":"Governance, Safety & Risk Management","q":"An organization wants to be able to reconstruct exactly what an agent did and why, several weeks after an incident involving an incorrect automated action. What governance capability does this require?","options":["A larger context window, which has no bearing on post-incident reconstruction","Durable, detailed audit logging of the agent's decisions, tool calls, and inputs/outputs, retained long enough to support post-incident investigation","Deleting logs quickly to reduce storage costs","Relying on the agent to accurately recall and explain its own past actions from memory"],"correct":1,"exp":"Reconstructing an incident weeks later requires durable, detailed audit logs retained for long enough to investigate — not a bigger context window, aggressive log deletion, or trusting the model's own unverified recollection of what it did."},{"domain":"Governance, Safety & Risk Management","q":"A risk review asks whether a customer-facing Claude deployment could be manipulated via prompt injection embedded in a webpage the agent is asked to summarize. What mitigation most directly addresses this specific risk?","options":["Increasing the model's temperature to make outputs more varied","Removing all logging so less sensitive data is retained","Using a larger model with no other changes to the tool or permission setup","Treating fetched web content as untrusted input, isolating it from the agent's instructions, and scoping/gating any resulting tool calls so injected text can't directly trigger privileged actions"],"correct":3,"exp":"Prompt injection via fetched content is mitigated by treating that content as untrusted data (not instructions), isolating it from the agent's own directives, and gating what actions can actually be triggered as a result — not by changing temperature, model size, or logging levels, none of which address the actual injection vector."},{"domain":"Stakeholder Communication & Lifecycle Management","q":"Midway through a project, legal flags a new data-residency requirement that wasn't part of the original discovery conversations. What does this suggest about the original stakeholder engagement?","options":["Nothing — requirements discovered mid-project are always unavoidable and unrelated to discovery quality","The engineering team is solely at fault regardless of who was consulted during discovery","Legal/compliance stakeholders should have been engaged during discovery, since their constraints can materially change what's actually deployable","The project should be cancelled immediately with no attempt to accommodate the new requirement"],"correct":2,"exp":"Late-surfacing legal/compliance requirements are often a sign that those stakeholders weren't sufficiently engaged during discovery — their constraints (like data residency) can materially reshape the architecture, which is exactly why they belong in discovery from the start."},{"domain":"Stakeholder Communication & Lifecycle Management","q":"A sponsor wants a status update on a Claude-powered project's progress, but a full technical readout would take an hour they don't have. What's the best communication approach?","options":["A concise summary framed around business outcomes, risks, and timeline — offering the technical detail as optional follow-up rather than the default","Sending the full technical architecture document with no summary and letting them find the relevant parts","Skipping the update entirely since a full readout isn't feasible in the time available","Providing only a timeline with no mention of risks or outcomes"],"correct":0,"exp":"When time is constrained, leading with business outcomes, risk, and timeline — and offering technical depth as optional follow-up — respects the sponsor's time while still giving them what they actually need to make decisions."},{"domain":"Stakeholder Communication & Lifecycle Management","q":"A Claude-powered system is being sunset and replaced. What lifecycle step is most important to include before decommissioning it?","options":["Immediately deleting all logs and documentation associated with the system to save storage","Communicating the transition timeline to affected stakeholders and confirming any dependent workflows have a migration path before turning it off","Turning the system off first, then notifying stakeholders afterward","Leaving the decision entirely to the engineering team with no stakeholder communication at all"],"correct":1,"exp":"Sunsetting a live system safely means communicating the transition and confirming dependent workflows have a migration path before decommissioning — not after, and not silently deleting supporting records that might still be needed."},{"domain":"Claude Models, Prompting & Context Engineering","q":"A prompt asks Claude to answer strictly using only the content of an attached document, with no outside knowledge. Which technique is this most directly an example of?","options":["Few-shot prompting, since it relies on worked examples","Prompt caching, since it's about reducing repeated token cost","Chain-of-thought prompting, since it's about showing reasoning steps","Grounding/context-constrained prompting, since it explicitly restricts the model's answer to the provided context rather than its trained knowledge"],"correct":3,"exp":"Explicitly instructing the model to answer only from provided content — rather than its general training knowledge — is a grounding/context-constraint technique, distinct from few-shot examples, caching (a cost optimization), or chain-of-thought (reasoning transparency)."},{"domain":"Claude Models, Prompting & Context Engineering","q":"A team keeps a single, carefully-maintained system prompt at the very start of every request, followed by variable user content afterward. What cost/performance benefit does this structure support?","options":["It supports effective prompt caching, since a stable prefix at the start of the prompt is what allows repeated requests to hit the cache instead of reprocessing the same content at full cost","It guarantees the model will never hallucinate regardless of the user content that follows","It eliminates the need for any evaluation of the system prompt's effectiveness","It has no effect on cost or latency, since prompt structure is unrelated to either"],"correct":0,"exp":"Keeping stable content (like a system prompt) as a consistent prefix at the start of every request is exactly what enables prompt caching to work — variable content afterward doesn't break the cached prefix match."},{"domain":"Developer Productivity & Operational Enablement","q":"A developer wants Claude Code to automatically run a project's linter and tests after every code change, without needing to remember to trigger them manually each time. What's the best mechanism?","options":["This isn't possible; Claude Code has no way to run commands automatically after a change","Manually re-invoke Claude Code from scratch after every single file save","Configure a hook that fires after file edits to automatically run the linter/test commands, enforcing the check without relying on the developer to remember","Disable all automation to avoid unpredictable behavior"],"correct":2,"exp":"Hooks are exactly the mechanism for firing deterministic actions (like running a linter or test suite) on defined events (like a file edit) without depending on the developer or the model to remember to trigger them manually."},{"domain":"Developer Productivity & Operational Enablement","q":"An engineering org wants new hires to get consistent, vetted Claude Code configuration (approved tools, skills, MCP servers) on day one without manually copying settings between machines. What's the best approach?","options":["Have each new hire independently research and configure their own settings from scratch","Distribute configuration via a managed plugin/marketplace and server-managed settings so approved tools and policies are applied consistently without manual per-machine setup","Share one engineer's personal laptop configuration file over chat with no review process","Avoid setting any standard configuration to preserve individual flexibility"],"correct":1,"exp":"Managed plugin distribution plus server-managed settings is the standard way to give every new hire the same vetted, approved configuration automatically — ad hoc copying or no standard at all doesn't scale and risks inconsistent or insecure setups."},{"domain":"Solution Design & Architecture","q":"A validated architecture review lists three failure mechanisms in a rejected proposal: the entry point was chosen before the user was named, a protocol layer was carried forward from a prior project without a reuse justification, and the highest-consequence path was assigned to the weakest deterministic guarantee. What single principle unifies all three mistakes?","options":["Every decision should default to the most capable available model regardless of task","Entry point, integration layer, and enforcement mechanism should each be chosen to fit the actual user and the actual work, not carried forward by default from whatever was used last time","Multi-agent systems should always be preferred over single-agent designs","Compliance work should always be the first component built in any architecture"],"correct":1,"exp":"All three failures share the same root cause: choices were carried forward as defaults rather than derived from the actual user and task at hand. Entry point, integration layer (MCP), and enforcement mechanism (deterministic code vs. subagents) each need to be selected to fit the specific work, not reused out of habit."},{"domain":"Governance, Safety & Risk Management","q":"An architecture assigns a bank's compliance checks — the system's highest-consequence path — to subagents rather than deterministic server-side code. From a governance standpoint, what's the core problem?","options":["Subagents are always slower than server-side code, which is purely a performance concern","The consequence level of a task should determine how strong its enforcement guarantee needs to be, and this design paired the highest-consequence work with the weakest available guarantee","Subagents cannot be logged or audited under any circumstances","Compliance checks should never be automated in any form"],"correct":1,"exp":"Governance design should match the strength of an enforcement mechanism to the consequence of getting it wrong. Subagents offer weaker deterministic guarantees than explicit server-side code, so pairing them with the highest-consequence path (compliance) inverts the risk-appropriate design."},{"domain":"Integration","q":"A partner asks Bounteous to validate a design that exposes a customer database through MCP, even though only one internal application will ever call it. From an integration-architecture standpoint, what's the issue?","options":["MCP requires a minimum of two consuming clients to function technically","MCP earns its integration cost through reuse across multiple clients; with a single consumer, that justification doesn't hold and a direct API call would be simpler","Direct API calls are always less secure than MCP regardless of context","There is no issue — MCP should be the default for every data source regardless of client count"],"correct":1,"exp":"MCP's standardization value comes from letting multiple clients reach the same tool entry point without duplicated integration work. When there's genuinely only one consumer, that reusability benefit isn't realized, and the added protocol layer is cost without a matching payoff."},{"domain":"Claude Models, Prompting & Context Engineering","q":"A high-volume support-reply prompt asset places the customer's ticket and a variable manual excerpt ahead of the tone guidelines, policy rules, and output schema that are identical on every call. What's the effect on this asset at scale?","options":["No effect, since caching depends only on total prompt length","Cache hit rate drops sharply, because prompt caching requires a byte-for-byte matching prefix from the very start, and leading with variable content means no two requests share that prefix","The output schema is bypassed whenever the prefix changes","This ordering is optimal, since variable content should always be processed first for lowest latency"],"correct":1,"exp":"Effective prompt caching depends on an identical prefix from the start of the request. Leading with per-request variable content (the ticket, the excerpt) means the static instructions never form a shared prefix across calls, defeating the purpose of caching at exactly the volume where it matters most."},{"domain":"Governance, Safety & Risk Management","q":"A reusable support-reply asset states in its instructions that Claude must never promise a refund, but a governance review wants stronger assurance than the model's compliance with that sentence. What satisfies that?","options":["Repeating the instruction in bold at both the start and end of the prompt","A closed output schema whose action values never include a refund authorization, plus a boolean field the calling system validates and hard-rejects on before any reply reaches a customer","Lowering the model's temperature to zero","Trusting the few-shot examples alone to convey the rule without any code-level check"],"correct":1,"exp":"Structural enforcement lives in the output contract and the code that validates it — a closed action enum with no refund-authorizing value and a boolean the system checks before sending — not in how the instruction is worded or how confidently the model is sampled."},{"domain":"Developer Productivity & Operational Enablement","q":"A prompt asset used hundreds of times daily needs its validation logic to update in lockstep with its instructions whenever policy changes, without relying on every user to separately track a documentation page. What packaging choice addresses this directly?","options":["A shared text template with a separate wiki page describing the current validation rules","A versioned Skill bundling the prompt instructions together with the validation script, so a single version update carries both changes at once","An unversioned snippet pasted independently into each user's own workspace","A recorded training video reviewed once per quarter"],"correct":1,"exp":"Packaging the instructions and the validation script together as a versioned Skill means policy changes ship as one update that automatically carries to everyone using the asset — a template with separate documentation, an unversioned snippet, or periodic training all leave room for drift between the instructions and the enforcement logic."}],"domainWeights":{"Integration":0.19,"Solution Design & Architecture":0.17,"Evaluation, Testing & Optimisation":0.16,"Governance, Safety & Risk Management":0.14,"Stakeholder Communication & Lifecycle Management":0.14,"Claude Models, Prompting & Context Engineering":0.13,"Developer Productivity & Operational Enablement":0.07},"testSize":30,"strongAt":27,"solidAt":21,"historyKey":"ccarp_practice_history","subtitle":"Pulls a fresh, randomized 30-question set each time from a 70-question bank, weighted to CCAR-P's 7 domains (Integration 19%, Solution Design 17%, Evaluation/Testing/Optimisation 16%, Governance/Safety/Risk 14%, Stakeholder Communication/Lifecycle 14%, Claude Models/Prompting/Context Engineering 13%, Developer Productivity/Operational Enablement 7%). Score history saved in this browser.","caveat":"Domain weights and exam format are from third-party sources (tutorialsdojo.com, claudecertificationguide.com), cross-checked against each other but not yet confirmed against Anthropic's own official CCAR-P materials. Most questions are original, written to match documented domain topics. The Solution Design & Architecture, Governance, Integration, Models/Prompting, and Developer Productivity questions added 2026-09-23/26 are grounded directly in official Anthropic Academy Module 1 content (behavior properties, platform layers, primitives, decomposition framework, the Entry Points & Governance case study, and the reusable prompt asset exercise) — those are the closest thing here to real official-source material."}};

let currentExam = localStorage.getItem("ccar_selected_exam") || "CCAR-F";
if (!examData[currentExam]) currentExam = "CCAR-F";

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generateTest() {
  const cfg = examData[currentExam];
  const questionBank = cfg.questionBank;
  const domainWeights = cfg.domainWeights;
  const TEST_SIZE = cfg.testSize;
  const byDomain = {};
  questionBank.forEach(q => {
    if (!byDomain[q.domain]) byDomain[q.domain] = [];
    byDomain[q.domain].push(q);
  });

  let selected = [];
  const domains = Object.keys(domainWeights);
  let allocated = 0;
  const counts = {};
  domains.forEach((d, idx) => {
    if (idx === domains.length - 1) {
      counts[d] = TEST_SIZE - allocated;
    } else {
      const c = Math.round(domainWeights[d] * TEST_SIZE);
      counts[d] = c;
      allocated += c;
    }
  });

  domains.forEach(d => {
    const pool = shuffle(byDomain[d] || []);
    const n = Math.min(counts[d], pool.length);
    selected = selected.concat(pool.slice(0, n));
  });

  if (selected.length < TEST_SIZE) {
    const remaining = shuffle(questionBank.filter(q => !selected.includes(q)));
    selected = selected.concat(remaining.slice(0, TEST_SIZE - selected.length));
  }

  return shuffle(selected).slice(0, Math.min(TEST_SIZE, selected.length));
}

  localStorage.setItem('ccar_selected_exam', currentExam);
  applyExamChrome();
  renderTest();
  renderHistory();
}

function renderTest() {
  currentTest = generateTest();
  const form = document.getElementById('quizForm');
  form.innerHTML = '';
  let currentDomain = "";

  currentTest.forEach((item, i) => {
    if (item.domain !== currentDomain) {
      currentDomain = item.domain;
      const h = document.createElement('div');
      h.className = 'domain-header';
      h.textContent = currentDomain;
      form.appendChild(h);
    }
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = 'card-' + i;

    const qText = document.createElement('div');
    qText.className = 'question-text';
    qText.textContent = (i+1) + '. ' + item.q;
    card.appendChild(qText);

    item.options.forEach((opt, j) => {
      const optDiv = document.createElement('div');
      optDiv.className = 'option';
      optDiv.id = 'opt-' + i + '-' + j;
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'q' + i;
      input.value = j;
      input.id = 'input-' + i + '-' + j;
      const label = document.createElement('label');
      label.htmlFor = 'input-' + i + '-' + j;
      label.textContent = String.fromCharCode(65+j) + ') ' + opt;
      optDiv.appendChild(input);
      optDiv.appendChild(label);
      optDiv.onclick = () => input.checked = true;
      card.appendChild(optDiv);
    });

    const exp = document.createElement('div');
    exp.className = 'explanation';
    exp.id = 'exp-' + i;
    exp.textContent = item.exp;
    card.appendChild(exp);

    form.appendChild(card);
  });

  document.getElementById('submitBar').style.display = 'block';
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('results').classList.remove('show');
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function loadHistory() {
  try {
    const raw = localStorage.getItem(examData[currentExam].historyKey);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function saveAttempt(record) {
  try {
    const key = examData[currentExam].historyKey;
    const history = loadHistory();
    history.push(record);
    localStorage.setItem(key, JSON.stringify(history));
  } catch (e) {
    console.warn('Could not save history', e);
  }
}

function renderHistory() {
  const container = document.getElementById('historyContent');
  const history = loadHistory();
  if (history.length === 0) {
    container.innerHTML = '<div class="empty-history">No attempts recorded yet for ' + examData[currentExam].label + '. Take a test above to start tracking your progress.</div>';
    return;
  }
  let html = '<table><thead><tr><th>Date</th><th>Score</th><th>%</th></tr></thead><tbody>';
  history.slice().reverse().forEach(h => {
    const pct = Math.round((h.score / h.total) * 100);
    html += '<tr><td>' + h.date + '</td><td>' + h.score + ' / ' + h.total + '</td><td>' + pct + '%</td></tr>';
  });
  html += '</tbody></table><span class="clear-history" onclick="clearHistory()">Clear all history</span>';
  container.innerHTML = html;
}

function clearHistory() {
  try { localStorage.removeItem(examData[currentExam].historyKey); } catch (e) {}
  renderHistory();
}
window.clearHistory = clearHistory;

document.getElementById('generateBtn').addEventListener('click', renderTest);
document.getElementById('clearHistoryBtn').addEventListener('click', clearHistory);
document.getElementById('retakeLink').addEventListener('click', renderTest);
document.getElementById('btnCcarF').addEventListener('click', () => switchExam('CCAR-F'));
document.getElementById('btnCcarP').addEventListener('click', () => switchExam('CCAR-P'));

document.getElementById('submitBtn').addEventListener('click', () => {
  const cfg = examData[currentExam];
  const form = document.getElementById('quizForm');
  let score = 0;
  const domainStats = {};
  currentTest.forEach((item, i) => {
    if (!domainStats[item.domain]) domainStats[item.domain] = {correct:0, total:0};
    domainStats[item.domain].total++;
    const selected = form.querySelector('input[name="q' + i + '"]:checked');
    const selectedVal = selected ? parseInt(selected.value) : -1;
    const isCorrect = selectedVal === item.correct;
    if (isCorrect) { score++; domainStats[item.domain].correct++; }

    item.options.forEach((opt, j) => {
      const optDiv = document.getElementById('opt-' + i + '-' + j);
      if (j === item.correct) optDiv.classList.add('correct');
      else if (j === selectedVal) optDiv.classList.add('incorrect');
    });
    document.getElementById('exp-' + i).classList.add('show');
  });

  document.getElementById('submitBtn').disabled = true;
  document.getElementById('score').textContent = score + ' / ' + currentTest.length;
  let verdict = 'Below ' + cfg.solidAt + ': revisit the corresponding domain notes/courses before your next attempt.';
  if (score >= cfg.strongAt) verdict = 'Strong readiness on this material.';
  else if (score >= cfg.solidAt) verdict = 'Solid, but review missed domains before exam day.';
  document.getElementById('verdict').textContent = verdict;

  const breakdown = document.getElementById('domainBreakdown');
  breakdown.innerHTML = '';
  Object.keys(domainStats).forEach(d => {
    const row = document.createElement('div');
    const stat = domainStats[d];
    row.innerHTML = '<span>' + d + '</span><span>' + stat.correct + ' / ' + stat.total + '</span>';
    breakdown.appendChild(row);
  });

  document.getElementById('results').classList.add('show');
  document.getElementById('results').scrollIntoView({behavior:'smooth'});

  saveAttempt({
    date: new Date().toLocaleString(),
    score: score,
    total: currentTest.length,
    domainStats: domainStats
  });
  renderHistory();
});

// initial load
applyExamChrome();
renderTest();
renderHistory();
</script>
</body>
</html>
